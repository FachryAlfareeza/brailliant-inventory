AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BrAIlliant scan API (API Gateway HTTP API + Lambda + DynamoDB + Rekognition)

# Local test: bash scripts/local_start.sh
# Deploy:     bash scripts/deploy.sh   (builds the Pillow layer, then sam build + sam deploy)

Parameters:
  OcrEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  BudgetEmail:
    Type: String
    Default: ""
    Description: email for the $1/month budget alert (leave empty to skip)

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 15
    MemorySize: 512   # Pillow needs more than 128 MB for camera photos

Resources:
  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: brailliant-scans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: scanId, AttributeType: S }
      KeySchema:
        - { AttributeName: scanId, KeyType: HASH }
      Tags:
        - { Key: Project, Value: brailliant }

  # Pillow (image library) for Linux, made by scripts/build_layer.sh
  PillowLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: brailliant-pillow
      ContentUri: build/layer/
      CompatibleRuntimes: [python3.13]

  ScanApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Tags:
        Project: brailliant

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: brailliant-scan-api
      CodeUri: src/
      Handler: app.lambda_handler
      Layers: [!Ref PillowLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref ScansTable
          OCR_ENABLED: !Ref OcrEnabled
          DYNAMODB_ENDPOINT: ""   # set in scripts/local_env.json for local testing
      # only CRUD on this table + text detection (SAM adds the CloudWatch Logs permissions)
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:DescribeTable
              Resource: !GetAtt ScansTable.Arn
            - Effect: Allow
              Action: rekognition:DetectText
              Resource: "*"
      Events:
        CreateScan: { Type: HttpApi, Properties: { ApiId: !Ref ScanApi, Method: POST,   Path: /scans } }
        ListScans:  { Type: HttpApi, Properties: { ApiId: !Ref ScanApi, Method: GET,    Path: /scans } }
        GetScan:    { Type: HttpApi, Properties: { ApiId: !Ref ScanApi, Method: GET,    Path: "/scans/{scanId}" } }
        UpdateScan: { Type: HttpApi, Properties: { ApiId: !Ref ScanApi, Method: PUT,    Path: "/scans/{scanId}" } }
        DeleteScan: { Type: HttpApi, Properties: { ApiId: !Ref ScanApi, Method: DELETE, Path: "/scans/{scanId}" } }
        Health:     { Type: HttpApi, Properties: { ApiId: !Ref ScanApi, Method: GET,    Path: /health } }
      Tags:
        Project: brailliant

  ScanFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ScanFunction}
      RetentionInDays: 7

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: brailliant-budget
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 1, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  ApiUrl:
    Value: !Sub https://${ScanApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref ScansTable
