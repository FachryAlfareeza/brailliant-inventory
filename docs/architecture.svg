<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#374151}
      .x{font-size:11px;fill:#4b5563}
      .lbl{font-size:12px;fill:#111827;font-weight:600}
      .lblg{font-size:11.5px;fill:#4b5563}
      .lblr{font-size:11.5px;fill:#b91c1c;font-weight:600}
      .box{rx:10;stroke-width:1.6}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#111827">BrAIlliant Parts Inventory API (Track C: Serverless)</text>
  <text x="30" y="60" class="s">One entity (Part), CRUD + health check, region us-east-1, no servers or VPC</text>

  <!-- Clients -->
  <rect x="30" y="150" width="190" height="150" class="box" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="125" y="178" text-anchor="middle" class="t">Clients</text>
  <text x="125" y="202" text-anchor="middle" class="s">curl / test_api.sh</text>
  <text x="125" y="220" text-anchor="middle" class="s">seed.py (98 BOM parts)</text>
  <text x="125" y="238" text-anchor="middle" class="s">browser / Postman</text>
  <text x="125" y="264" text-anchor="middle" class="x">BrAIlliant build team</text>
  <text x="125" y="280" text-anchor="middle" class="x">(prototype parts stock)</text>

  <!-- AWS cloud boundary -->
  <rect x="270" y="90" width="900" height="420" rx="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="290" y="114" font-size="14" font-weight="700" fill="#b45309">AWS Cloud (us-east-1)</text>

  <!-- API Gateway -->
  <rect x="300" y="140" width="250" height="200" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="425" y="166" text-anchor="middle" class="t">Amazon API Gateway</text>
  <text x="425" y="184" text-anchor="middle" class="s">HTTP API, stage $default</text>
  <text x="316" y="210" class="x" font-family="Consolas, monospace">POST   /parts</text>
  <text x="316" y="226" class="x" font-family="Consolas, monospace">GET    /parts[?section=]</text>
  <text x="316" y="242" class="x" font-family="Consolas, monospace">GET    /parts/{partId}</text>
  <text x="316" y="258" class="x" font-family="Consolas, monospace">PUT    /parts/{partId}</text>
  <text x="316" y="274" class="x" font-family="Consolas, monospace">DELETE /parts/{partId}</text>
  <text x="316" y="290" class="x" font-family="Consolas, monospace">GET    /health</text>
  <text x="425" y="316" text-anchor="middle" class="x">HTTPS, CORS, throttled to</text>
  <text x="425" y="331" text-anchor="middle" class="x">10 req/s (burst 20)</text>

  <!-- Lambda -->
  <rect x="620" y="140" width="230" height="200" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="735" y="166" text-anchor="middle" class="t">AWS Lambda</text>
  <text x="735" y="184" text-anchor="middle" class="s">brailliant-parts-api</text>
  <text x="735" y="210" text-anchor="middle" class="x">Python 3.13, arm64, 128 MB</text>
  <text x="735" y="228" text-anchor="middle" class="x">handler app.lambda_handler</text>
  <text x="735" y="246" text-anchor="middle" class="x">checks the route and input,</text>
  <text x="735" y="262" text-anchor="middle" class="x">returns JSON</text>
  <text x="735" y="288" text-anchor="middle" class="x">env TABLE_NAME=brailliant-parts</text>
  <text x="735" y="318" text-anchor="middle" class="lblr">role: brailliant-parts-lambda-role</text>

  <!-- DynamoDB -->
  <rect x="920" y="140" width="230" height="200" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="1035" y="166" text-anchor="middle" class="t">Amazon DynamoDB</text>
  <text x="1035" y="184" text-anchor="middle" class="s">table brailliant-parts</text>
  <text x="1035" y="210" text-anchor="middle" class="x">PK partId (String)</text>
  <text x="1035" y="226" text-anchor="middle" class="x">on-demand (PAY_PER_REQUEST)</text>
  <text x="936" y="252" class="x">section, reference, description</text>
  <text x="936" y="268" class="x">partNumber, package, location</text>
  <text x="936" y="284" class="x">qtyPerDevice, qtyInStock</text>
  <text x="936" y="300" class="x">unitCostLow, unitCostHigh</text>
  <text x="936" y="316" class="x">createdAt, updatedAt</text>

  <!-- CloudWatch -->
  <rect x="620" y="400" width="230" height="84" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="735" y="428" text-anchor="middle" class="t">Amazon CloudWatch Logs</text>
  <text x="735" y="448" text-anchor="middle" class="x">/aws/lambda/brailliant-parts-api</text>
  <text x="735" y="466" text-anchor="middle" class="x">kept 7 days</text>

  <!-- Data flow arrows -->
  <line x1="220" y1="210" x2="296" y2="210" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="224" y="200" class="lbl">1 request</text>
  <line x1="296" y1="250" x2="224" y2="250" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="228" y="268" class="lbl">6 response</text>

  <line x1="550" y1="210" x2="616" y2="210" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="553" y="200" class="lbl">2 invoke</text>
  <line x1="616" y1="250" x2="554" y2="250" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="556" y="268" class="lbl">5 result</text>

  <line x1="850" y1="210" x2="916" y2="210" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="853" y="200" class="lbl">3 query</text>
  <line x1="916" y1="250" x2="854" y2="250" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="856" y="268" class="lbl">4 item</text>

  <line x1="735" y1="340" x2="735" y2="396" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="745" y="374" class="lblg">logs</text>

  <!-- IAM / security callouts -->
  <rect x="300" y="380" width="290" height="110" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="314" y="402" class="lblr">IAM / security</text>
  <text x="314" y="420" class="x">- only this API can invoke the Lambda</text>
  <text x="314" y="435" class="x">  (resource policy with source ARN)</text>
  <text x="314" y="452" class="x">- Lambda role can only do CRUD on</text>
  <text x="314" y="467" class="x">  this one table and write its logs</text>
  <text x="314" y="482" class="x">- HTTPS everywhere</text>

  <rect x="880" y="380" width="270" height="110" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="894" y="402" class="lblr">Data</text>
  <text x="894" y="420" class="x">- DynamoDB encrypts at rest by</text>
  <text x="894" y="435" class="x">  default, no keys in the code</text>
  <text x="894" y="452" class="x">- bad input returns 400</text>
  <text x="894" y="467" class="x">- duplicate id 409, not found 404</text>
  <text x="894" y="482" class="x">- no login yet (planned)</text>

  <!-- Dashed IAM link from lambda role to dynamodb -->
  <path d="M 790 318 C 860 330, 900 350, 960 340" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrR)"/>

  <!-- Deployment path -->
  <rect x="30" y="555" width="1140" height="140" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="50" y="580" class="t">How it gets deployed</text>
  <rect x="50" y="596" width="220" height="82" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="160" y="620" text-anchor="middle" class="lbl">My laptop (Git Bash)</text>
  <text x="160" y="640" text-anchor="middle" class="x">Git repo, unit tests</text>
  <text x="160" y="656" text-anchor="middle" class="x">scripts/deploy.sh</text>
  <text x="160" y="672" text-anchor="middle" class="x">or sam deploy</text>
  <line x1="270" y1="637" x2="356" y2="637" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="360" y="596" width="230" height="82" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="475" y="620" text-anchor="middle" class="lbl">AWS CLI v2</text>
  <text x="475" y="640" text-anchor="middle" class="x">IAM user (not root)</text>
  <text x="475" y="656" text-anchor="middle" class="x">+ $1/month budget alert</text>
  <line x1="590" y1="637" x2="676" y2="637" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="680" y="596" width="470" height="82" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="915" y="620" text-anchor="middle" class="lbl">Creates (or updates)</text>
  <text x="915" y="640" text-anchor="middle" class="x">IAM role, DynamoDB table, Lambda function,</text>
  <text x="915" y="656" text-anchor="middle" class="x">HTTP API with 6 routes, invoke permission,</text>
  <text x="915" y="672" text-anchor="middle" class="x">log group (7 days) and the budget</text>
  <path d="M 915 596 L 915 520" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
</svg>
