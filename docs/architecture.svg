<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#374151}
      .x{font-size:11px;fill:#4b5563}
      .m{font-size:11px;fill:#4b5563;font-family:Consolas,monospace}
      .lbl{font-size:12px;fill:#111827;font-weight:600}
      .red{font-size:12px;fill:#b91c1c;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#111827">BrAIlliant Scan API (Track C: Serverless)</text>
  <text x="30" y="60" class="s">The device sends a photo, the cloud turns it into pins (graph mode) or braille text (text mode)</text>

  <!-- device -->
  <rect x="30" y="140" width="200" height="200" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="130" y="166" text-anchor="middle" class="t">BrAIlliant device</text>
  <text x="130" y="188" text-anchor="middle" class="s">ESP32-S3 + OV2640 camera</text>
  <text x="130" y="206" text-anchor="middle" class="s">96 x 64 pin display</text>
  <text x="44" y="234" class="x">1. press Shutter, take photo</text>
  <text x="44" y="250" class="x">2. POST /scans over Wi-Fi</text>
  <text x="44" y="266" class="x">   (deviceId, mode, JPEG)</text>
  <text x="44" y="282" class="x">3. raise the returned pins /</text>
  <text x="44" y="298" class="x">   show braille, read aloud</text>
  <text x="130" y="328" text-anchor="middle" class="x">(scripts/device_sim.py for now)</text>

  <!-- AWS cloud -->
  <rect x="270" y="90" width="900" height="440" rx="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="290" y="114" font-size="14" font-weight="700" fill="#b45309">AWS Cloud (us-east-1)</text>

  <!-- API Gateway -->
  <rect x="300" y="140" width="230" height="200" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="415" y="166" text-anchor="middle" class="t">Amazon API Gateway</text>
  <text x="415" y="184" text-anchor="middle" class="s">HTTP API, stage $default</text>
  <text x="316" y="212" class="m">POST   /scans</text>
  <text x="316" y="228" class="m">GET    /scans[?deviceId=]</text>
  <text x="316" y="244" class="m">GET    /scans/{scanId}</text>
  <text x="316" y="260" class="m">PUT    /scans/{scanId}</text>
  <text x="316" y="276" class="m">DELETE /scans/{scanId}</text>
  <text x="316" y="292" class="m">GET    /health</text>
  <text x="415" y="322" text-anchor="middle" class="x">HTTPS, throttled 10 req/s</text>

  <!-- Lambda -->
  <rect x="600" y="140" width="250" height="200" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="725" y="166" text-anchor="middle" class="t">AWS Lambda</text>
  <text x="725" y="184" text-anchor="middle" class="s">brailliant-scan-api (Python 3.13)</text>
  <text x="614" y="210" class="lbl">graph mode</text>
  <text x="614" y="226" class="x">grayscale, edges or dark ink,</text>
  <text x="614" y="242" class="x">fit and threshold to 96 x 64 pins</text>
  <text x="614" y="266" class="lbl">text mode</text>
  <text x="614" y="282" class="x">OCR with Rekognition, then</text>
  <text x="614" y="298" class="x">Grade 1 braille</text>
  <text x="725" y="326" text-anchor="middle" class="x">Pillow layer, 512 MB, 15 s</text>

  <!-- DynamoDB -->
  <rect x="920" y="140" width="230" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1035" y="166" text-anchor="middle" class="t">Amazon DynamoDB</text>
  <text x="1035" y="184" text-anchor="middle" class="s">table brailliant-scans</text>
  <text x="1035" y="208" text-anchor="middle" class="x">key scanId, on-demand</text>
  <text x="934" y="234" class="x">deviceId, mode, status, label,</text>
  <text x="934" y="250" class="x">read, sourceSize, method,</text>
  <text x="934" y="266" class="x">dots (64 rows x 96 bits),</text>
  <text x="934" y="282" class="x">dotCount, text, braille,</text>
  <text x="934" y="298" class="x">createdAt, updatedAt</text>
  <text x="1035" y="326" text-anchor="middle" class="x">one item ~2 KB, no photos kept</text>

  <!-- Rekognition + CloudWatch -->
  <rect x="920" y="380" width="230" height="80" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
  <text x="1035" y="408" text-anchor="middle" class="t">Amazon Rekognition</text>
  <text x="1035" y="428" text-anchor="middle" class="x">DetectText (text mode only)</text>
  <text x="1035" y="444" text-anchor="middle" class="x">off when testing locally</text>
  <rect x="600" y="400" width="250" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="725" y="428" text-anchor="middle" class="t">CloudWatch Logs</text>
  <text x="725" y="448" text-anchor="middle" class="x">kept 7 days</text>

  <!-- arrows -->
  <line x1="230" y1="210" x2="296" y2="210" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="236" y="200" class="lbl">1 photo</text>
  <line x1="296" y1="260" x2="234" y2="260" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="236" y="280" class="lbl">6 pins</text>
  <line x1="530" y1="210" x2="596" y2="210" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="536" y="200" class="lbl">2 invoke</text>
  <line x1="596" y1="260" x2="534" y2="260" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="536" y="280" class="lbl">5 result</text>
  <line x1="850" y1="210" x2="916" y2="210" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="856" y="200" class="lbl">4 save</text>
  <path d="M 850 300 C 890 330, 900 370, 916 405" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="872" y="368" class="lbl">3 OCR</text>
  <line x1="725" y1="340" x2="725" y2="396" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="733" y="374" class="x">logs</text>

  <!-- IAM box -->
  <rect x="300" y="380" width="270" height="130" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="314" y="402" class="red">IAM / security</text>
  <text x="314" y="422" class="x">- only this API can invoke the Lambda</text>
  <text x="314" y="440" class="x">- Lambda role: CRUD on this one table,</text>
  <text x="314" y="456" class="x">  rekognition:DetectText, own logs</text>
  <text x="314" y="474" class="x">- HTTPS, DynamoDB encrypted at rest</text>
  <text x="314" y="492" class="x">- photos are not stored</text>

  <rect x="920" y="476" width="230" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="1035" y="501" text-anchor="middle" class="x">AWS Budgets: $1/month email alert</text>

  <!-- deploy + later -->
  <rect x="30" y="560" width="1140" height="160" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="50" y="586" class="t">How it gets deployed</text>
  <rect x="50" y="600" width="240" height="100" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="170" y="624" text-anchor="middle" class="lbl">My laptop (Git Bash)</text>
  <text x="170" y="644" text-anchor="middle" class="x">Git repo, unit tests</text>
  <text x="170" y="660" text-anchor="middle" class="x">scripts/deploy.sh</text>
  <text x="170" y="676" text-anchor="middle" class="x">or local_start.sh (no AWS)</text>
  <line x1="290" y1="650" x2="346" y2="650" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="350" y="600" width="330" height="100" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="515" y="624" text-anchor="middle" class="lbl">AWS SAM (CloudFormation)</text>
  <text x="515" y="644" text-anchor="middle" class="x">template.yaml: table, Pillow layer, function,</text>
  <text x="515" y="660" text-anchor="middle" class="x">role, HTTP API + 6 routes, log group, budget</text>
  <text x="515" y="676" text-anchor="middle" class="x">deployed by an IAM user, not root</text>
  <rect x="720" y="600" width="430" height="100" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="935" y="624" text-anchor="middle" class="lbl">Later weeks</text>
  <text x="935" y="644" text-anchor="middle" class="x">S3 for photos + Textract for full pages</text>
  <text x="935" y="660" text-anchor="middle" class="x">Grade 2 braille (Liblouis), math mode (Nemeth)</text>
  <text x="935" y="676" text-anchor="middle" class="x">device login (API key / Cognito)</text>
  <path d="M 515 600 L 515 534" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
</svg>
